<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TeamPlay — Enter Passcode</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/help.css" />
</head>
<body data-page="access">
  <div class="center-stage">
    <div class="card">
      <div class="brand"><span class="dot"></span><h1>TeamPlay</h1></div>
      <p>Enter the passcode your admin gave you to get in.</p>

      <form id="access-form">
        <label for="passcode-input">Passcode</label>
        <input type="password" id="passcode-input" autocomplete="off" required autofocus />
        <button type="submit" id="access-submit" class="btn-primary">Enter</button>
      </form>
      <p class="error-text" id="access-error"></p>
    </div>
  </div>

  <script type="module" src="js/access.js"></script>
  <script type="module" src="js/help.js"></script>
</body>
</html>
