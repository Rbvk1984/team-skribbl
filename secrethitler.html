<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shadow Vote</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/help.css" />
  <link rel="stylesheet" href="css/premium.css"/>
</head>
<body data-page="secrethitler">
<div class="aurora" aria-hidden="true"><div class="ab ab1"></div><div class="ab ab2"></div><div class="ab ab3"></div><div class="ab ab4"></div></div>
  <!-- ---------- Main game screen ---------- -->
  <div id="game-screen" class="sh-layout">

    <!-- Policy tracker -->
    <div class="sh-tracker-bar">
      <div class="sh-tracker">
        <span class="sh-tracker-label">Liberal</span>
        <div id="sh-liberal-track" class="sh-track sh-track-liberal"></div>
      </div>
      <div class="sh-tracker">
        <span class="sh-tracker-label">Fascist</span>
        <div id="sh-fascist-track" class="sh-track sh-track-fascist"></div>
      </div>
      <div class="sh-election-tracker">
        <span class="sh-tracker-label">Failed votes</span>
        <div id="sh-election-pips" class="sh-pips"></div>
      </div>
    </div>

    <!-- Status -->
    <div id="sh-status" class="sh-status-bar"></div>

    <!-- Role card -->
    <div id="sh-role-card" class="sh-role-card hidden">
      <p id="sh-role-label"></p>
      <p id="sh-role-detail" class="sh-role-detail"></p>
    </div>

    <!-- Player list / actions -->
    <div class="sh-main-area">
      <ul id="sh-player-list" class="sh-player-list"></ul>

      <!-- Nomination (president picks chancellor) -->
      <div id="sh-nominate-panel" class="sh-panel hidden">
        <p>You are the President. Choose a Chancellor:</p>
        <ul id="sh-nominate-list" class="sh-player-list"></ul>
      </div>

      <!-- Voting -->
      <div id="sh-vote-panel" class="sh-panel hidden">
        <p id="sh-vote-prompt"></p>
        <div class="sh-vote-buttons">
          <button id="sh-vote-ja"   class="btn-primary sh-ja-btn">Ja!</button>
          <button id="sh-vote-nein" class="btn-secondary sh-nein-btn">Nein!</button>
        </div>
        <p id="sh-vote-waiting" class="hidden" style="font-size:0.85rem; margin-top:10px;"></p>
      </div>

      <!-- President discards one of 3 policy cards -->
      <div id="sh-president-discard-panel" class="sh-panel hidden">
        <p>You drew these 3 policies. Discard one (secretly):</p>
        <div id="sh-pres-cards" class="sh-cards"></div>
      </div>

      <!-- Chancellor enacts one of 2 policy cards -->
      <div id="sh-chancellor-enact-panel" class="sh-panel hidden">
        <p>The President passed you 2 policies. Enact one:</p>
        <div id="sh-chan-cards" class="sh-cards"></div>
      </div>

      <!-- Executive action -->
      <div id="sh-executive-panel" class="sh-panel hidden">
        <p id="sh-executive-prompt"></p>
        <ul id="sh-executive-list" class="sh-player-list"></ul>
      </div>

      <!-- Vote results log -->
      <div id="sh-vote-result" class="sh-vote-result hidden">
        <p id="sh-vote-result-text"></p>
      </div>
    </div>

    <p class="error-text" id="sh-error"></p>
  </div>

  <!-- ---------- End screen ---------- -->
  <div id="sh-end-screen" class="center-stage hidden">
    <div class="card">
      <h1 id="sh-winner-label"></h1>
      <p id="sh-win-reason"></p>
      <div id="sh-roles-reveal" style="margin:16px 0;"></div>
      <a href="lobby.html"><button class="btn-primary">Back to lobby</button></a>
    </div>
  </div>

  <script type="module" src="js/secrethitler.js"></script>
  <script type="module" src="js/help.js"></script>
</body>
</html>
